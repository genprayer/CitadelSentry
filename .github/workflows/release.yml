name: Release Citadel Sentry

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.2)'
        required: true
        default: '1.2.2'

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact_name: citadel-sentry-linux-amd64
            build_cmd: wails build -tags webkit2_41 -platform linux/amd64 -s
            output_path: build/bin/citadel-sentry
          - os: windows-latest
            artifact_name: citadel-sentry-windows-amd64.exe
            build_cmd: wails build -platform windows/amd64 -s
            output_path: build/bin/citadel-sentry.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux Dependencies (WebKit2GTK & GTK3)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Install Frontend Dependencies & Generate Nuxt
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run typecheck
          npm --prefix frontend run lint
          npm --prefix frontend run generate

      - name: Verify Go Source
        run: |
          go vet ./...
          go test ./...

      - name: Build Desktop Application
        run: ${{ matrix.build_cmd }}

      - name: Rename Output Binary
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.output_path }}" "dist/${{ matrix.artifact_name }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  release:
    name: Publish GitHub Release (Keep 3 Latest)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Determine Tag & Release Name
        id: release_meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="v${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: ${TAG}" >&2
            exit 1
          fi
          if [ "$(cat VERSION)" != "${TAG#v}" ]; then
            echo "VERSION does not match release tag ${TAG}" >&2
            exit 1
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Name Platform Assets And Generate Checksums
        shell: bash
        run: |
          TAG="${{ steps.release_meta.outputs.tag }}"
          cd dist
          mv citadel-sentry-linux-amd64 "citadel-sentry-${TAG}-linux-amd64"
          mv citadel-sentry-windows-amd64.exe "citadel-sentry-${TAG}-windows-amd64.exe"
          sha256sum "citadel-sentry-${TAG}-linux-amd64" "citadel-sentry-${TAG}-windows-amd64.exe" > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release_meta.outputs.tag }}"
          gh release create "$TAG" dist/* \
            --title "Citadel Sentry $TAG" \
            --generate-notes
